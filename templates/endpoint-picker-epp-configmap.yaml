apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  multimodal-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: modality-filter
    - type: max-score-picker
    - type: single-profile-handler
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: modality-filter
      - pluginRef: max-score-picker
      - pluginRef: queue-scorer
        weight: 1
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  tts.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig

    plugins:
    - name: profileSelector
      type: header-profile-handler
      parameters:
        headerName: EPP-Profile
        defaultProfile: default
    - name: activeRequest
      type: active-request-scorer
    - name: loadAware
      type: load-aware-scorer
    - name: runningRequests
      type: running-requests-size-scorer
    - name: queue
      type: queue-scorer
    - name: tokenLoad
      type: token-load-scorer
    - name: kvCacheUtilization
      type: kv-cache-utilization-scorer
    - name: endpointAttribute
      type: endpoint-attribute-scorer
      parameters:
        attributeKey: omni.waiting
        algorithm:
          type: linear_lower_is_better
    - name: contextLength
      type: context-length-aware
    - name: prefixCacheProducer
      type: approx-prefix-cache-producer
    - name: prefixCache
      type: prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: prefixCacheProducer
    - name: sessionAffinity
      type: session-affinity-scorer
    - name: mm-embeddings-cache-producer
      type: mm-embeddings-cache-producer
    - name: mmEmbeddingsCache
      type: mm-embeddings-cache-scorer
    - name: loraAffinity
      type: lora-affinity-scorer
    - name: headerLabelAffinity
      type: header-label-affinity-scorer
      parameters:
        headerName: X-Preferred-Model
        labelKey: llm-d.ai/baseline-model
    - name: topologyAffinity
      type: topology-affinity-scorer
    - name: endpoint-notification-source
      type: endpoint-notification-source
    - name: metrics-data-source
      type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
    - name: core-metrics-extractor
      type: core-metrics-extractor
      parameters:
        engineConfigs:
        - name: vllm-omni
          queuedRequestsSpec: vllm_omni:num_requests_waiting
          runningRequestsSpec: vllm_omni:num_requests_running
          kvUsageSpec: vllm:kv_cache_usage_perc{stage=0}
          loraSpec: ""
          cacheInfoSpec: ""
          customMetrics:
          - attributeKey: omni.waiting
            metricSpec: vllm_omni:num_requests_waiting
    - name: maxScore
      type: max-score-picker

    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: activeRequest
      - pluginRef: maxScore
    - name: activeRequestProfile
      plugins:
      - pluginRef: activeRequest
      - pluginRef: maxScore
    - name: loadAwareProfile
      plugins:
      - pluginRef: loadAware
      - pluginRef: maxScore
    - name: runningRequestSizeProfile
      plugins:
      - pluginRef: runningRequests
      - pluginRef: maxScore
    - name: queueProfile
      plugins:
      - pluginRef: queue
      - pluginRef: maxScore
    - name: tokenLoadProfile
      plugins:
      - pluginRef: tokenLoad
      - pluginRef: maxScore
    - name: kvCacheUtilizationProfile
      plugins:
      - pluginRef: kvCacheUtilization
      - pluginRef: maxScore
    - name: endpointAttributeProfile
      plugins:
      - pluginRef: endpointAttribute
      - pluginRef: maxScore
    - name: contextLengthProfile
      plugins:
      - pluginRef: contextLength
      - pluginRef: maxScore
    - name: prefixCacheProfile
      plugins:
      - pluginRef: prefixCache
      - pluginRef: maxScore
    - name: sessionAffinityProfile
      plugins:
      - pluginRef: sessionAffinity
      - pluginRef: maxScore
    - name: mmEmbeddingsCacheProfile
      plugins:
      - pluginRef: mmEmbeddingsCache
      - pluginRef: maxScore
    - name: loraAffinityProfile
      plugins:
      - pluginRef: loraAffinity
      - pluginRef: maxScore
    - name: headerLabelAffinityProfile
      plugins:
      - pluginRef: headerLabelAffinity
      - pluginRef: maxScore
    - name: topologyAffinityProfile
      plugins:
      - pluginRef: topologyAffinity
      - pluginRef: maxScore

    dataLayer:
      injectDefaults: true
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: mm-embeddings-cache-producer
