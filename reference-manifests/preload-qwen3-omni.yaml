apiVersion: batch/v1
kind: Job
metadata:
  labels:
    batch.kubernetes.io/controller-uid: bf534bc3-c043-4cda-aa08-8f02bec7e0ff
    batch.kubernetes.io/job-name: preload-qwen3-omni
    controller-uid: bf534bc3-c043-4cda-aa08-8f02bec7e0ff
    job-name: preload-qwen3-omni
  name: preload-qwen3-omni
  namespace: vllm-omni-validation
spec:
  activeDeadlineSeconds: 14400
  backoffLimit: 0
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels:
      batch.kubernetes.io/controller-uid: bf534bc3-c043-4cda-aa08-8f02bec7e0ff
  suspend: false
  template:
    metadata:
      labels:
        batch.kubernetes.io/controller-uid: bf534bc3-c043-4cda-aa08-8f02bec7e0ff
        batch.kubernetes.io/job-name: preload-qwen3-omni
        controller-uid: bf534bc3-c043-4cda-aa08-8f02bec7e0ff
        job-name: preload-qwen3-omni
    spec:
      containers:
      - args:
        - |
          set -eu
          python -m venv /tmp/download-venv
          /tmp/download-venv/bin/pip install --no-cache-dir \
            "huggingface_hub==0.36.0"
          /tmp/download-venv/bin/python -u - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          from huggingface_hub import HfApi, snapshot_download

          repo = "Qwen/Qwen3-Omni-30B-A3B-Instruct"
          root = Path("/models")
          destination = root / "Qwen3-Omni-30B-A3B-Instruct"
          revision_file = root / "qwen3-omni-revision.txt"
          complete_file = root / "qwen3-omni-download-complete.json"

          if revision_file.exists():
              revision = revision_file.read_text().strip()
          else:
              revision = HfApi().model_info(repo, revision="main").sha
              revision_file.write_text(revision + "\n")

          complete_file.unlink(missing_ok=True)
          print(f"Model: {repo}", flush=True)
          print(f"Pinned revision: {revision}", flush=True)
          print(f"Destination: {destination}", flush=True)

          snapshot_download(
              repo_id=repo,
              revision=revision,
              local_dir=str(destination),
              max_workers=2,
          )

          if not (destination / "config.json").is_file():
              raise RuntimeError("Missing config.json")
          if not any(destination.rglob("*.safetensors")):
              raise RuntimeError("No safetensors weights found")

          record = {
              "model_id": repo,
              "revision": revision,
              "path": str(destination),
              "completed_at": datetime.now(timezone.utc).isoformat(),
          }
          complete_file.write_text(json.dumps(record, indent=2) + "\n")
          os.sync()
          print(json.dumps(record, indent=2), flush=True)
          print("MODEL DOWNLOAD COMPLETE", flush=True)
          PY
        command:
        - /bin/sh
        - -c
        env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /models/.huggingface
        - name: HF_HUB_DISABLE_XET
          value: '1'
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: '120'
        - name: HF_HUB_DISABLE_TELEMETRY
          value: '1'
        image: docker.io/library/python:3.11-slim-bookworm
        imagePullPolicy: IfNotPresent
        name: download
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 4Gi
            memory: 4Gi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: l42-h06-000-xe8640.rdu3.labs.perfscale.redhat.com
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1001040000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1001040000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: qwen3-omni-model-cache
