apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm-tts-sim
  name: vllm-tts-sim
  namespace: vllm-omni-validation
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: multimodal-inference-pool
      llm-d.ai/model-arch: autoregressive-tts
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: multimodal-inference-pool
        llm-d.ai/engine-type: vllm
        llm-d.ai/model-arch: autoregressive-tts
    spec:
      containers:
      - args:
        - --model
        - qwen3-omni
        - --port
        - '8000'
        - --mode
        - echo
        - --log-http
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: IfNotPresent
        name: vllm-sim
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
