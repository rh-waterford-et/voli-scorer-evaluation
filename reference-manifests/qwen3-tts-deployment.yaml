apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    llm-d.ai/baseline-model: qwen3-tts
  name: vllm-omni-tts
  namespace: vllm-omni-validation
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      llm-d.ai/baseline-model: qwen3-tts
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: multimodal-inference-pool
        llm-d.ai/baseline-model: qwen3-tts
        llm-d.ai/engine-type: vllm-omni
        llm-d.ai/model-arch: autoregressive-tts
    spec:
      containers:
      - args:
        - serve
        - --omni
        - --model
        - /models/qwen3-tts/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
        - --served-model-name
        - qwen3-tts
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --max-model-len
        - '12000'
        - --stage-overrides
        - '{"0":{"gpu_memory_utilization":0.82,"max_num_batched_tokens":4096,"max_num_seqs":4},"1":{"gpu_memory_utilization":0.11,"max_num_batched_tokens":4096,"max_num_seqs":4},"2":{"gpu_memory_utilization":0.05}}'
        command:
        - vllm
        env:
        - name: USER
          value: vllm
        - name: LOGNAME
          value: vllm
        - name: HOME
          value: /tmp
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor
        - name: CUDA_VISIBLE_DEVICES
          value: 0,0
        image: docker.io/vllm/vllm-omni:v0.28.0
        imagePullPolicy: IfNotPresent
        name: vllm-omni
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: '16'
            memory: 128Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '8'
            memory: 64Gi
            nvidia.com/gpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models/qwen3-tts
          name: model-cache
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: l42-h06-000-xe8640.rdu3.labs.perfscale.redhat.com
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: qwen3-omni-model-cache
