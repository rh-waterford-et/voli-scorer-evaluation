apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: endpoint-picker
    meta.helm.sh/release-namespace: vllm-omni-validation
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: endpoint-picker-epp
    app.kubernetes.io/version: 0.0.0
    llm-d.ai/igw-mode: llm-d-router-gateway
  name: endpoint-picker-epp
  namespace: vllm-omni-validation
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      llm-d-router-gateway: endpoint-picker-epp
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: 2c1be9822cc3c6d2052e469ae93422fb8b5c97311b963ab6544337b3fb836b35
        kubectl.kubernetes.io/restartedAt: '2026-10-21T11:18:34+01:00'
      labels:
        llm-d-router-gateway: endpoint-picker-epp
        llm-d.ai/igw-mode: llm-d-router-gateway
    spec:
      containers:
      - args:
        - --pool-name
        - endpoint-picker
        - --pool-namespace
        - vllm-omni-validation
        - --pool-group
        - inference.networking.k8s.io
        - --zap-encoder
        - json
        - --config-file
        - /config/tts.yaml
        - --grpc-health-port
        - '9003'
        - --allow-experimental-plugins=true
        - --secure-serving=false
        - --tracing=false
        - --v=4
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: TRAINING_SERVER_URL
          value: http://localhost:8000
        - name: PREDICTION_SERVER_URL
          value: http://localhost:8001
        - name: LATENCY_MAX_SAMPLE_SIZE
          value: '10000'
        - name: LATENCY_MAX_CONCURRENT_DISPATCHES
          value: '36'
        - name: LATENCY_COALESCE_WINDOW_MS
          value: '1'
        image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0
        imagePullPolicy: Always
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 9003
            service: liveness
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: epp
        ports:
        - containerPort: 9002
          name: grpc
          protocol: TCP
        - containerPort: 9003
          name: grpc-health
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 9003
            service: readiness
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: plugins-config-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: endpoint-picker-epp
      serviceAccountName: endpoint-picker-epp
      terminationGracePeriodSeconds: 130
      volumes:
      - configMap:
          defaultMode: 420
          name: endpoint-picker-epp
        name: plugins-config-volume
