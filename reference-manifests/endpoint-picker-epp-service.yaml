apiVersion: v1
kind: Service
metadata:
  annotations:
    meta.helm.sh/release-name: endpoint-picker
    meta.helm.sh/release-namespace: vllm-omni-validation
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: endpoint-picker-epp
    app.kubernetes.io/version: 0.0.0
  name: endpoint-picker-epp
  namespace: vllm-omni-validation
spec:
  clusterIP: 172.31.105.18
  clusterIPs:
  - 172.31.105.18
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: kubernetes.io/h2c
    name: grpc-ext-proc
    port: 9002
    protocol: TCP
    targetPort: 9002
  - name: http-metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    llm-d-router-gateway: endpoint-picker-epp
  sessionAffinity: None
  type: ClusterIP
