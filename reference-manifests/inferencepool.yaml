apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  annotations:
    meta.helm.sh/release-name: endpoint-picker
    meta.helm.sh/release-namespace: vllm-omni-validation
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: endpoint-picker-epp
    app.kubernetes.io/version: 0.0.0
  name: endpoint-picker
  namespace: vllm-omni-validation
spec:
  appProtocol: http
  endpointPickerRef:
    failureMode: FailOpen
    group: ''
    kind: Service
    name: endpoint-picker-epp
    port:
      number: 9002
  selector:
    matchLabels:
      app: multimodal-inference-pool
  targetPorts:
  - number: 8000
