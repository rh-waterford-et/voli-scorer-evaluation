apiVersion: v1
kind: Service
metadata:
  labels:
    gateway.istio.io/managed: openshift.io-gateway-controller-v1
    gateway.networking.k8s.io/gateway-class-name: data-science-gateway-class
    gateway.networking.k8s.io/gateway-name: inference-gateway
  name: inference-gateway-data-science-gateway-class
  namespace: vllm-omni-validation
spec:
  allocateLoadBalancerNodePorts: true
  clusterIP: 172.31.80.211
  clusterIPs:
  - 172.31.80.211
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: PreferDualStack
  ports:
  - appProtocol: tcp
    name: status-port
    nodePort: 30806
    port: 15021
    protocol: TCP
    targetPort: 15021
  - appProtocol: http
    name: http
    nodePort: 31670
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    gateway.networking.k8s.io/gateway-name: inference-gateway
  sessionAffinity: None
  type: LoadBalancer
