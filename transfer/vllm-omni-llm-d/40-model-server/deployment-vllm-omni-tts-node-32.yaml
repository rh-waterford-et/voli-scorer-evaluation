# RECOMMENDED. Policy-compliant replacement for the live `vllm-tts-omni`
# Deployment (see ../deployment-vllm-omni-tts.NOT-RECOMMENDED.yaml for why
# that one shouldn't be used).
#
# Combines two patterns already in this repo:
#   - node-pinned, read-only cache mount of the approved BM-003 revision,
#     exactly like manifests/wetlab-ai/vllm-omni/bm-003/deployment.yaml
#     (including the wetlab.redhat.com/baseline-node convention used by its
#     Service selector)
#   - the llm-d InferencePool membership label (`app: multimodal-inference-pool`
#     + llm-d.ai/* labels) from the live vllm-tts-omni Deployment, so this
#     still participates in Gateway -> HTTPRoute -> InferencePool -> EPP
#     routing
#
# No internet egress needed at startup -- model comes from the node-local
# PVC. Duplicate this file per cached GPU node (see -node-42.yaml /
# -node-5c.yaml) to give the InferencePool more than one backend, the same
# way bm-003-vllm-omni / bm-003-vllm-omni-42 already do today.
#
# Note: `app` is used for the pool-membership label here (required by the
# InferencePool selector), so -- unlike bm-003-vllm-omni -- this Deployment's
# *own* pod selector is disambiguated using
# `wetlab.redhat.com/baseline-node` instead, to avoid three node deployments
# all trying to own each other's pods via an identical `app` label.
#
# REQUIRES the model-cache PVC + approved BM-003 cache contents to already
# exist on this node on the new cluster (manifests/model-cache/ +
# manifests/model-cache/preload/) -- deferred per your request, so this will
# sit at Pending until that's done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-omni-tts-node-32
  namespace: wetlab-ai
  labels:
    wetlab.redhat.com/baseline-model: bm-003
    wetlab.redhat.com/baseline-node: node-32
spec:
  replicas: 0 # <-- set to 1 once the node-local cache is populated and you're ready to serve
  strategy:
    type: Recreate
  selector:
    matchLabels:
      wetlab.redhat.com/baseline-model: bm-003
      wetlab.redhat.com/baseline-node: node-32
  template:
    metadata:
      labels:
        wetlab.redhat.com/baseline-model: bm-003
        wetlab.redhat.com/baseline-node: node-32
        # InferencePool membership labels -- must match
        # router.modelServers.matchLabels in ../20-chart/values-wetlab-ai.yaml
        app: multimodal-inference-pool
        llm-d.ai/engine-type: vllm-omni
        llm-d.ai/model-arch: autoregressive-tts
    spec:
      nodeSelector:
        kubernetes.io/hostname: c0-47-0e-20-70-32 # <-- change to the new cluster's equivalent GPU hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm-omni
          image: vllm/vllm-omni:v0.24.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: USER
              value: vllm
            - name: LOGNAME
              value: vllm
            - name: HOME
              value: /tmp
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
          command:
            - vllm
          args:
            - serve
            - --omni
            - --model
            - /models/bm-003
            - --served-model-name
            - bm-003
            - --task-type
            - CustomVoice
            - --max-model-len
            - "4000"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models/bm-003
              subPath: approved/bm-003/0c0e3051f131929182e2c023b9537f8b1c68adfe
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-node-32 # <-- must match the PVC bound to this node on the new cluster
