# TEMPLATE -- do not commit a real token.
#
# NOT currently needed. None of the manifests in 40-model-server/ download
# anything from Hugging Face (that was the non-compliant behaviour this
# package deliberately avoids -- see ../README.md). The only consumer of
# this secret would be the Helm chart's optional tokenizer sidecar
# (router.tokenizer.*), which is disabled in ../20-chart/values-wetlab-ai.yaml
# (tokenizer.enabled: false). Kept only in case that sidecar is enabled later.
#
# Create for real with, e.g.:
#   oc create secret generic llm-d-hf-token \
#     -n wetlab-ai \
#     --from-literal=HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
apiVersion: v1
kind: Secret
metadata:
  name: llm-d-hf-token
  namespace: wetlab-ai
type: Opaque
stringData:
  HF_TOKEN: "REPLACE_ME"
